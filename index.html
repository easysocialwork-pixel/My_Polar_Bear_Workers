    <!-- 2. 使用 <style> 標籤編寫 CSS -->
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            
            /* 滿版北極熊背景圖 + 45% 透明度黑色遮罩（確保前方文字清晰，請自行替換正確的圖片路徑） */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('./permanent_Images/p1234.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            font-family: '微軟正黑體', sans-serif;
        }
        
        /* 標題置中 */
        .rtp {
            font-family: "Faster One", "Rampart One", sans-serif;
            font-weight: 400;
            font-style: normal;
            text-align: center; 
            margin-bottom: 30px;
            /* 因背景變暗，文字改為純白並加上陰影，大幅提升閱讀性 */
            color: #ffffff;
            font-size: 72px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }
        
        /* 表格樣式與置中優化 */
        table {
            border: 1px solid #b31ed8;
            border-collapse: separate; 
            border-spacing: 5px;
            width: 50%;
            min-width: 300px;
            margin: 0 auto 40px auto; 
            /* 表格背景改為半透明白底，避免融入背景 */
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
        }
        td {
            border: 1px solid #dab12b;
            padding: 10px;
            border-radius: 3px;
            text-align: center;
            color: #333; /* 確保表格內文字是深色 */
        }

        /* 圖片並排置中區塊 (RWD 響應式優化) */
        .image-container {
            display: flex;             
            justify-content: center;   
            flex-wrap: wrap;           
            gap: 30px;                 
            margin-bottom: 40px;       
        }
        .image-box {
            border: 3px solid #e9791e;
            border-radius: 8px;        
            overflow: hidden;          
            max-width: 45%;            
            min-width: 250px;    
            /* 為證照圖外框加上半透明白底，使其在暗色背景中格外亮眼 */
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        /* 原本網頁上的圖片滑鼠移上去時顯示點擊手指，並有輕微放大感 */
        .image-box img {
            display: block;            
            width: 100%;               
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .image-box img:hover {
            transform: scale(1.02); /* 滑鼠懸停時微幅放大 */
        }

        /* 按鈕專用區塊 */
        .button-area {
            text-align: center; 
            margin-bottom: 40px;
        }
        /* 按鈕通用樣式 */
        .btn {
            padding: 12px 28px;        
            font-size: 16px;           
            font-weight: bold;         
            border: none;              
            border-radius: 25px;       
            cursor: pointer;           
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            transition: all 0.3s ease; 
            margin: 10px;              
        }
        
        .btn:active {
            transform: translateY(1px); 
            box-shadow: 0 2px 3px rgba(0,0,0,0.15); 
        }

        /* 「送出」按鈕 */
        .btn-submit {
            background-color: #2e8b57; 
            color: white;
        }
        .btn-submit:hover {
            background-color: #246b43; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(46, 139, 87, 0.5); 
        }
        
        /* 「清空」按鈕 */
        .btn-reset {
            background-color: #cd5c5c; 
            color: white;
        }
        .btn-reset:hover {
            background-color: #b24343; 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(205, 92, 92, 0.5); 
        }

        /* 下拉選單外殼 */
        .cool-select-container {
            position: relative;
            width: 280px;
        }

        /* 下拉選單本體（高質感的半透明毛玻璃效果） */
        .cool-select {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 下拉選單內部的選項底色修正 */
        .cool-select option {
            color: #333333;
            background-color: #ffffff;
        }

        .cool-select:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .cool-select:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.35);
            border-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        /* 箭頭顏色優化為白色 */
        .select-arrow {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #ffffff;
            pointer-events: none;
        }

        /* 選單整行排版 */
        .menu-row {
            display: flex !important;       
            flex-direction: row;            
            justify-content: center;        
            align-items: center;            
            gap: 20px;                      
            margin: 0 auto 40px auto;       
            width: 100%;                    
            flex-wrap: wrap; /* 確保選單在小螢幕時也能自動換行 */
        }

        /* 滿版彈出遮罩層（預設隱藏） */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: zoom-out; 
        }

        /* 當遮罩層被活性化時顯示 */
        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 放大後的圖片樣式與動畫 */
        .lightbox-image {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .lightbox-overlay.active .lightbox-image {
            transform: scale(1); 
        }
    </style>
